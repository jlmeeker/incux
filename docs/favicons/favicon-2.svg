<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Option 2: Container box icon -->
  <rect width="32" height="32" rx="8" fill="#4f6bed"/>
  <!-- outer box -->
  <rect x="6" y="10" width="20" height="14" rx="2" fill="none" stroke="white" stroke-width="2"/>
  <!-- lid -->
  <rect x="9" y="7" width="14" height="4" rx="1.5" fill="white"/>
  <!-- inner line suggesting contents -->
  <line x1="11" y1="17" x2="21" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="20" x2="17" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
</svg>
